name: Publish YT Manager v1.0.4 Release

on:
  workflow_run:
    workflows: ["Build YT Manager Desktop"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer from successful desktop build
        uses: actions/download-artifact@v4
        with:
          name: YT-Manager-v1.0.4-Windows-Installer
          path: release-assets
          repository: dollarise/kubangyt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer
        run: |
          test -s "release-assets/YT Manager Setup 1.0.4.exe"
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: YT Manager v1.0.4 — Per-Account Browser Profiles
          body: |
            YT Manager v1.0.4 untuk Windows.

            **Pembaruan:**
            - Menambahkan pengaturan profil browser untuk setiap akun.
            - Pengaturan zoom browser tersimpan secara terpisah per akun.
            - Pengguna dapat memilih halaman awal YouTube atau YouTube Studio per akun.
            - Akun baru otomatis memperoleh profil browser dan sesi terpisah.
            - Cookie dan data sesi setiap akun tetap terisolasi.

            **Installer:** Unduh file `YT Manager Setup 1.0.4.exe` pada bagian Assets.
          token: ${{ secrets.RELEASE_TOKEN }}
          files: release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
