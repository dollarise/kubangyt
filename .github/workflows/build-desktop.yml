name: Build YT Manager Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/publish-desktop-release.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run desktop:pack

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YT-Manager-v1.0.4-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
